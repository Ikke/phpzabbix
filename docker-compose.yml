services:
  zabbix-frontend:
    image: alpinelinux/zabbix-ci:${ZABBIX_VERSION:-7.4}
    ports:
     - 7871:8080
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      DB_SERVER_HOST: db
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Etc/UTC
    depends_on:
      - db
    healthcheck:
      test: [
        CMD, curl, -s, --fail, http://localhost:8080/api_jsonrpc.php,
        --json, '{"id": "1", "jsonrpc": "2.0", "method": "apiinfo.version", "params": {}}'
        ]
      interval: 3s
      timeout: 1s
      retries: 10
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix

  integration-test:
    image: php:${PHP_VERSION:-8.5}-cli-alpine
    profiles: [command]
    command: vendor/bin/phpunit integration/
    environment:
      ZABBIX_API_URL: http://zabbix-frontend:8080/api_jsonrpc.php
      ZABBIX_API_USERNAME: Admin
      ZABBIX_API_PASSWORD: zabbix
      ZABBIX_API_TOKEN: 5db357b158fb2269cebb91045043c9ad21cb05c4c924c731b6503a500efd3c99
    depends_on:
      zabbix-frontend:
        condition: service_healthy
    volumes:
      - ./:/src
    working_dir: /src

  test:
    image: php:${PHP_VERSION:-8.5}-cli-alpine
    profiles: [command]
    command: vendor/bin/phpunit test/
    volumes:
      - ./:/src
    working_dir: /src
